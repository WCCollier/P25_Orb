<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 690" role="img" aria-label="The 800 MHz band drawn to scale, showing the uplink block from 806 to 824 megahertz, the downlink block from 851 to 869, the 45 megahertz duplex split, and detail views of the two roughly 2 megahertz windows the receiver actually captures." xmlns="http://www.w3.org/2000/svg" width="1040" height="690">
<rect x="0" y="0" width="1040" height="690" fill="#FBFCFA"/>

        <defs>
          <marker id="p2-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#6B7A73"></path>
          </marker>
          <marker id="p2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#14201C"></path>
          </marker>
        </defs>

        <text x="30" y="34" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">THE BAND AT TRUE SCALE — 804 to 871 MHz</text>

        
        <rect x="107" y="62" width="242" height="42" fill="#F0E3D8"></rect>
        <rect   x="107" y="62" width="242" height="42" fill="none" stroke="#B4571A" stroke-width="1.6"></rect>
        <rect  x="349" y="62" width="362" height="42" fill="#EFF2EF"></rect>
        <rect x="711" y="62" width="242" height="42" fill="#D9E8E5"></rect>
        <rect   x="711" y="62" width="242" height="42" fill="none" stroke="#16746B" stroke-width="1.6"></rect>

        <text x="228" y="80" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">UPLINK — 806–824</text>
        <text     x="228" y="95" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">handsets transmit</text>
        <text     x="530" y="80" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">824 – 851 MHz</text>
        <text     x="530" y="95" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">other allocations</text>
        <text x="832" y="80" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="11.5px" font-weight="600" letter-spacing=".02em">DOWNLINK — 851–869</text>
        <text     x="832" y="95" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">the tower transmits</text>

        
        <rect x="110" y="58" width="27" height="50" fill="none" stroke="#B4571A" stroke-width="2.2"></rect>
        <rect x="714" y="58" width="34" height="50" fill="none" stroke="#16746B" stroke-width="2.2"></rect>

        
        <path d="M107 104 L107 114 M349 104 L349 114 M711 104 L711 114 M953 104 L953 114" fill="none" stroke="#14201C" stroke-width="1"></path>
        <text x="107" y="126" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">806</text>
        <text x="349" y="126" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">824</text>
        <text x="711" y="126" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">851</text>
        <text x="953" y="126" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">869</text>

        
        <path d="M110 108 L60 212" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <path d="M137 108 L500 212" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <path d="M714 108 L540 212" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <path d="M748 108 L980 212" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>

        <text x="150" y="172" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">DETAIL A · ×13</text>
        <text x="880" y="172" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">DETAIL B · ×11</text>

        
        <rect x="60" y="212" width="440" height="182" fill="none" stroke="#B4571A" stroke-width="1.6"></rect>
        <text x="280" y="236" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="12px" font-weight="700" letter-spacing=".09em">DETAIL A — UPLINK WINDOW</text>
        <text x="280" y="252" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">~806.2 – 808.2 MHz · about 2 MHz · uplink coherent group</text>

        
        <path d="M90 330 L470 330" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M150 330 L150 336 M237 330 L237 336 M323 330 L323 336 M409 330 L409 336" fill="none" stroke="#14201C" stroke-width="1"></path>
        <text x="150" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">806.5</text>
        <text x="237" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">807.0</text>
        <text x="323" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">807.5</text>
        <text x="409" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">808.0</text>

        
        <path d="M101 330 L101 276" fill="none" stroke="#B4571A" stroke-width="2.2"></path>
        <text x="101" y="272" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">806.2125 — UPLINK CONTROL</text>
        <text x="101" y="286" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">handset → tower · every channel request</text>

        
        <path d="M185 330 L185 306 M271 330 L271 306 M392 330 L392 306" fill="none" stroke="#B4571A" stroke-width="2.2"></path>
        <text x="280" y="302" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">granted voice, uplink side</text>

        <text x="280" y="378" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">EVERYTHING A HANDSET TRANSMITS ON THE TRUNK</text>

        
        <rect x="540" y="212" width="440" height="182" fill="none" stroke="#16746B" stroke-width="1.6"></rect>
        <text x="760" y="236" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="12px" font-weight="700" letter-spacing=".09em">DETAIL B — DOWNLINK WINDOW</text>
        <text x="760" y="252" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">~851.2 – 853.7 MHz · about 2.5 MHz · downlink coherent group</text>

        
        <path d="M570 330 L950 330" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M694 330 L694 336 M767 330 L767 336 M840 330 L840 336 M913 330 L913 336" fill="none" stroke="#14201C" stroke-width="1"></path>
        <text x="694" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">852.0</text>
        <text x="767" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">852.5</text>
        <text x="840" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">853.0</text>
        <text x="913" y="348" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">853.5</text>

        
        <path d="M579 330 L579 272" fill="none" stroke="#16746B" stroke-width="2.2"></path>
        <text x="572" y="268" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="11.5px" font-weight="600" letter-spacing=".02em">851.2125 — CONTROL CHANNEL</text>
        <text x="572" y="280" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">tower → handset · the entire event stream</text>

        
        <path d="M629 330 L629 300 L716 300" fill="none" stroke="#B4571A" stroke-width="2.2"></path>
        <text x="722" y="296" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">851.5500 — 8TAC95D</text>
        <text x="722" y="310" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">SIMPLEX · handsets transmit HERE</text>

        
        <path d="M579 344 L629 344" marker-start="url(#p2-dim)" marker-end="url(#p2-dim)" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="604" y="362" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">337.5 kHz</text>

        <path d="M761 330 L761 318 M855 330 L855 318" fill="none" stroke="#16746B" stroke-width="2.2"></path>
        <text x="950" y="364" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">repeated voice, as the tower relays it</text>

        <text x="760" y="378" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">a geographic accident, not a design choice — and it is why</text>
        <text x="760" y="390" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">TALKAROUND HANDSETS ARE LOCATABLE BY THE DOWNLINK GROUP</text>

        
        <path d="M30 424 L1010 424" fill="none" stroke="#C3CCC5" stroke-width="1.3"></path>
        <text x="30" y="450" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">WHY NOT ONE WIDE GROUP INSTEAD OF TWO NARROW ONES</text>

        
        <path d="M110 480 L714 480" marker-start="url(#p2-dim)" marker-end="url(#p2-dim)" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="412" y="474" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">45.000 MHz — the duplex split. Every trunk channel is a PAIR.</text>

        
        <path d="M110 510 L629 510" marker-start="url(#p2-dim)" marker-end="url(#p2-dim)" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="370" y="504" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">45.34 MHz — uplink control to talkaround: the full handset span</text>

        
        <text x="30" y="540" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">ONE COHERENT GROUP WOULD HAVE TO COVER THAT SPAN:</text>

        <path d="M110 560 L862 560" marker-end="url(#p2-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <path d="M110 554 L110 566 M862 554 L862 566" fill="none" stroke="#14201C" stroke-width="1"></path>
        <text x="872" y="564" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">AD9361 · 56 MHz — reaches it (the §5.5 fallback)</text>

        <path d="M110 590 L647 590" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <path d="M110 584 L110 596 M647 584 L647 596" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M647 590 L629 590" fill="none" stroke="#6B7A73" stroke-width="1.2" stroke-dasharray="5 3.5"></path>
        <text x="657" y="586" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">ADRV9002 · 40 MHz — falls 5.34 MHz short.</text>
        <text x="657" y="600" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">No allocation trick closes it: a group’s three</text>

        <text x="657" y="614" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">elements must be CO-TUNED to be coherent.</text>

        
        <g>
          <rect x="30" y="620" width="440" height="46" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
          <path d="M170 620 L170 666 M310 620 L310 666 M30 643 L470 643" fill="none" stroke="#C3CCC5" stroke-width="1.3"></path>
          <text x="40" y="634" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">PLATE</text>
          <text x="40" y="660" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">2</text>
          <text x="180" y="634" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">SOURCE</text>
          <text x="180" y="660" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">§3.3, §3.3.1</text>
          <text x="320" y="634" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">REVISED</text>
          <text x="320" y="660" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">2026-07-31</text>
        </g>
      </svg>