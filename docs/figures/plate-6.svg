        <text x="466" y="30" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">EL 3 — inboard</text>

        
        <path d="M308 249 L416 312" marker-start="url(#p6-dim)" marker-end="url(#p6-dim)" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="348" y="304" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">17.6 cm</text>

        
        <circle cx="475" cy="199" r="3.5" fill="#14201C"></circle>
        <circle cx="259" cy="220" r="3.5" fill="#14201C"></circle>
        <circle cx="439" cy="324" r="3.5" fill="#14201C"></circle>

        
        <path d="M230 96 L314 60" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="20" y="86" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">THREE FOLDING DIPOLES</text>
        <text x="20" y="102" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">half-wave sleeve, 16.6 cm, vertical —</text>
        <text x="20" y="115" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">matching P25's vertical polarisation</text>

        <path d="M230 262 L256 224" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="20" y="252" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">2× MAGNETOMETER</text>
        <text x="20" y="268" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">at the outboard lid corners, with the</text>
        <text x="20" y="281" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">IMU inboard at the hinge (§5.8)</text>

        <path d="M230 372 L300 300" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="20" y="362" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">LID OPENS TO 180°, FLAT</text>
        <text x="20" y="378" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">so the three elements form a HORIZONTAL</text>
        <text x="20" y="391" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">triangle. A vertical plane would make</text>
        <text x="20" y="404" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">mirrored azimuths indistinguishable (§5.1)</text>

        <path d="M736 214 L655 212" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="742" y="204" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">PROCESSING BODY + ARC EDGE</text>
        <text x="742" y="220" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">a factory-assembled bolt-on riding in the</text>
        <text x="742" y="233" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">trunk. Band-agnostic — identical for every</text>
        <text x="742" y="246" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">module (§7.2 item E)</text>

        <path d="M736 300 L600 300" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="742" y="290" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">APEX TOWARD THE BODY</text>
        <text x="742" y="306" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">Two elements outboard, one inboard. Only</text>
        <text x="742" y="319" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">ONE element sits in the case's shadowed</text>
        <text x="742" y="332" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">sector; the reverse orientation puts two</text>
        <text x="742" y="345" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">there. The outboard feeds also leave as</text>
        <text x="742" y="358" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">mirror images, so they are naturally</text>
        <text x="742" y="371" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">length-matched (§5.1, §5.3)</text>

        <text x="20" y="452" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">700/800 MHz only. At UHF the triangle needs a larger case; at VHF, a mast or vehicle mount.</text>
        <text x="1020" y="452" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">PLATE 6 · SOURCE §5.1, §5.6, §7.2 · REVISED 2026-08-01</text>
      </svg>