        <text x="20" y="30" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">DEPLOYED CONFIGURATION — 700/800 MHz BAND MODULE</text>
        <text x="20" y="46" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">isometric, illustrative proportions</text>

        
        
