        <path class="sig-dig" d="M890 914 L890 926" marker-end="url(#p1-mut)"></path>

        <rect class="bx" x="60" y="928" width="220" height="46"></rect>
        <rect class="bx" x="300" y="928" width="220" height="46"></rect>
        <rect class="bx" x="540" y="928" width="220" height="46"></rect>
        <rect class="bx" x="780" y="928" width="220" height="46"></rect>
        <text class="t-box" x="170" y="948" text-anchor="middle">SECURE ELEMENT</text>
        <text class="t-note" x="170" y="964" text-anchor="middle">key store</text>
        <text class="t-box" x="410" y="948" text-anchor="middle">GNSS +</text>
        <text class="t-note" x="410" y="964" text-anchor="middle">DISCIPLINED OSCILLATOR</text>
        <text class="t-box" x="650" y="948" text-anchor="middle">ETHERNET PHY</text>
        <text class="t-note" x="650" y="964" text-anchor="middle">to the base unit</text>
        <text class="t-box" x="890" y="948" text-anchor="middle">POWER SUPPLY</text>
        <text class="t-note" x="890" y="964" text-anchor="middle">separate from ARC Edge's</text>

        
        <path class="sig-dig" d="M650 974 L650 1008" marker-end="url(#p1-mut)"></path>
        <rect class="bx" x="540" y="1008" width="220" height="46"></rect>
        <text class="t-box" x="650" y="1028" text-anchor="middle">ARC EDGE</text>
        <text class="t-note" x="650" y="1044" text-anchor="middle">BASE UNIT</text>

        
        <g>
