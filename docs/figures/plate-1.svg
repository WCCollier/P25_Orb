<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 1070" role="img" aria-label="Block diagram of the P25 Orb receive architecture: three antenna elements pass through couplers and bandpass filters in the band module, cross the dock, are amplified and split, and feed an uplink coherent group and a downlink coherent group, which merge into an FPGA bridge and application compute." xmlns="http://www.w3.org/2000/svg" width="1040" height="1070">
<style>
body {
    background: #F2F4F1; color: #14201C;
    font-family: #000; font-size: 17px; line-height: 1.62;
    margin: 0; padding: 0 24px 96px;
  }
.wrap { max-width: 1120px; margin: 0 auto; }
.prose { max-width: 65ch; }
header.masthead {
    padding: 72px 0 40px; border-bottom: 1px solid #C3CCC5; margin-bottom: 48px;
  }
.eyebrow {
    font-family: #000; font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: #6B7A73; margin: 0 0 18px;
  }
h1 {
    font-family: #000; font-size: clamp(30px, 4.4vw, 46px); font-weight: 640;
    letter-spacing: -.02em; line-height: 1.08; text-wrap: balance; margin: 0 0 20px;
  }
.standfirst { font-size: 19px; color: #6B7A73; margin: 0; max-width: 62ch; }
h2 {
    font-family: #000; font-size: 22px; font-weight: 620;
    letter-spacing: -.01em; text-wrap: balance; margin: 0 0 6px;
  }
p { margin: 0 0 18px; }
section { margin-bottom: 64px; }
.section-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.section-head p { margin: 0; color: #6B7A73; font-size: 16px; max-width: 62ch; }
strong { font-weight: 600; }
code { font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: .88em; }
.plate {
    background: #FBFCFA;
    background-image:
      linear-gradient(#000 1px, transparent 1px),
      linear-gradient(90deg, #000 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid #C3CCC5; padding: 18px; overflow-x: auto;
  }
.plate svg { display: block; width: 100%; min-width: 720px; height: auto; }
.frame { fill: none; stroke: #C3CCC5; stroke-width: 1.3; }
.bx { fill: #FBFCFA; stroke: #14201C; stroke-width: 1.3; }
.bx-ul { fill: none; stroke: #B4571A; stroke-width: 1.6; }
.bx-dl { fill: none; stroke: #16746B; stroke-width: 1.6; }
.bx-q { fill: #FBFCFA; stroke: #6B7A73; stroke-width: 1.2; }
.sig { fill: none; stroke: #14201C; stroke-width: 1.4; }
.sig-ul { fill: none; stroke: #B4571A; stroke-width: 2.2; }
.sig-dl { fill: none; stroke: #16746B; stroke-width: 2.2; }
.sig-cal { fill: none; stroke: #6B7A73; stroke-width: 1.2; stroke-dasharray: 5 3.5; }
.sig-dig { fill: none; stroke: #6B7A73; stroke-width: 1.6; }
.dock { fill: none; stroke: #14201C; stroke-width: 2; stroke-dasharray: 12 5; opacity: .55; }
.pill { fill: #FBFCFA; stroke: none; }
.a-ink { fill: #14201C; }
.a-ul { fill: #B4571A; }
.a-dl { fill: #16746B; }
.a-mut { fill: #6B7A73; }
text { font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; fill: #14201C; }
.t-box { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.t-head { font-size: 12px;   font-weight: 700; letter-spacing: .09em; }
.t-note { font-size: 10px;   fill: #6B7A73; }
.t-port { font-size: 11px; }
.t-tiny { font-size: 9px;    fill: #6B7A73; letter-spacing: .06em; }
.t-ul { fill: #B4571A; }
.t-dl { fill: #16746B; }
.t-mut { fill: #6B7A73; }
.notes { display: grid; gap: 0; margin-top: 32px; border-top: 1px solid #C3CCC5; }
.note {
    display: grid; grid-template-columns: 116px 1fr; gap: 24px;
    padding: 18px 0; border-bottom: 1px solid #C3CCC5; align-items: start;
  }
.note dt {
    font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 12px; font-weight: 600;
    letter-spacing: .04em; color: #6B7A73; padding-top: 3px;
  }
.note dd { margin: 0; font-size: 16px; }
.verdict { border-left: 3px solid #B4571A; padding: 2px 0 2px 22px; margin: 0 0 18px; }
</style>
<rect x="0" y="0" width="1040" height="1070" fill="#FBFCFA"/>

        <defs>
          <marker id="p1-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-ink"></path>
          </marker>
          <marker id="p1-ul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-ul"></path>
          </marker>
          <marker id="p1-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-dl"></path>
          </marker>
          <marker id="p1-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-mut"></path>
          </marker>
        </defs>

        
        <rect class="frame" x="15" y="20" width="1005" height="270"></rect>
        <text class="t-head" x="30" y="42">BAND MODULE — HOUSING + ARRAY</text>
        <text class="t-note" x="30" y="58">band-specific, passive on RF</text>
        <text class="t-note" x="580" y="42">700/800: case lid · UHF: larger case · VHF: mast or vehicle</text>

        
        <path class="sig" d="M250 100 L250 72 M238 72 L250 56 L262 72"></path>
        <path class="sig" d="M380 100 L380 72 M368 72 L380 56 L392 72"></path>
        <path class="sig" d="M510 100 L510 72 M498 72 L510 56 L522 72"></path>
        <text class="t-port" x="270" y="70">EL 1</text>
        <text class="t-port" x="400" y="70">EL 2</text>
        <text class="t-port" x="530" y="70">EL 3</text>

        
        <text class="t-note" x="30" y="124">CAL TONES f_UL + f_DL</text>
        <text class="t-note" x="30" y="138">injected ARRAY-side (§3.1a)</text>
        <path class="sig-cal" d="M62 344 L62 151 L206 151" marker-end="url(#p1-mut)"></path>
        <path class="sig-cal" d="M290 151 L336 151" marker-end="url(#p1-mut)"></path>
        <path class="sig-cal" d="M420 151 L466 151" marker-end="url(#p1-mut)"></path>

        
        <rect class="bx" x="210" y="136" width="80" height="32"></rect>
        <rect class="bx" x="340" y="136" width="80" height="32"></rect>
        <rect class="bx" x="470" y="136" width="80" height="32"></rect>
        <text class="t-box" x="250" y="156" text-anchor="middle">COUPLR</text>
        <text class="t-box" x="380" y="156" text-anchor="middle">COUPLR</text>
        <text class="t-box" x="510" y="156" text-anchor="middle">COUPLR</text>

        <path class="sig" d="M250 100 L250 136"></path>
        <path class="sig" d="M380 100 L380 136"></path>
        <path class="sig" d="M510 100 L510 136"></path>

        <rect class="bx" x="210" y="182" width="80" height="32"></rect>
        <rect class="bx" x="340" y="182" width="80" height="32"></rect>
        <rect class="bx" x="470" y="182" width="80" height="32"></rect>
        <text class="t-box" x="250" y="202" text-anchor="middle">BPF</text>
        <text class="t-box" x="380" y="202" text-anchor="middle">BPF</text>
        <text class="t-box" x="510" y="202" text-anchor="middle">BPF</text>

        <path class="sig" d="M250 168 L250 182"></path>
        <path class="sig" d="M380 168 L380 182"></path>
        <path class="sig" d="M510 168 L510 182"></path>

        
        <path class="sig" d="M250 214 L250 344" marker-end="url(#p1-ink)"></path>
        <path class="sig" d="M380 214 L380 344" marker-end="url(#p1-ink)"></path>
        <path class="sig" d="M510 214 L510 344" marker-end="url(#p1-ink)"></path>

        
        <rect class="bx" x="640" y="124" width="260" height="70"></rect>
        <text class="t-box" x="770" y="150" text-anchor="middle">PA + DUPLEXER</text>
        <text class="t-note" x="770" y="168" text-anchor="middle">band-specific, ALWAYS populated,</text>
        <text class="t-note" x="770" y="182" text-anchor="middle">licence-gated</text>

        
        <text class="t-note" x="580" y="242">IMU + 2× MAGNETOMETER (§5.8)</text>
        <text class="t-note" x="580" y="258">MODULE ID + ARRAY-MANIFOLD EEPROM (§3.1a)</text>

        
        <path class="dock" d="M15 300 L1020 300"></path>
        <rect class="pill" x="480" y="290" width="80" height="20"></rect>
        <text class="t-head" x="520" y="305" text-anchor="middle">DOCK</text>

        
        <rect class="frame" x="15" y="312" width="1005" height="675"></rect>
        <text class="t-head" x="30" y="332">PROCESSING BODY — BAND-AGNOSTIC</text>

        <rect class="bx-q" x="15" y="344" width="95" height="52"></rect>
        <text class="t-box" x="62" y="364" text-anchor="middle">CAL SRC</text>
        <text class="t-note" x="62" y="380" text-anchor="middle">f_UL + f_DL</text>

        
        <rect class="bx" x="210" y="344" width="80" height="32"></rect>
        <rect class="bx" x="340" y="344" width="80" height="32"></rect>
        <rect class="bx" x="470" y="344" width="80" height="32"></rect>
        <text class="t-box" x="250" y="364" text-anchor="middle">LNA</text>
        <text class="t-box" x="380" y="364" text-anchor="middle">LNA</text>
        <text class="t-box" x="510" y="364" text-anchor="middle">LNA</text>
        <text class="t-note" x="580" y="358">all three on one board, one thermal environment —</text>
        <text class="t-note" x="580" y="372">drift is correlated and calibrates out (§3.1a)</text>

        
        <path class="sig" d="M250 376 L250 396"></path>
        <path class="sig" d="M380 376 L380 396"></path>
        <path class="sig" d="M510 376 L510 396"></path>

        <rect class="bx" x="210" y="396" width="80" height="32"></rect>
        <rect class="bx" x="340" y="396" width="80" height="32"></rect>
        <rect class="bx" x="470" y="396" width="80" height="32"></rect>
        <text class="t-box" x="250" y="416" text-anchor="middle">SPLIT</text>
        <text class="t-box" x="380" y="416" text-anchor="middle">SPLIT</text>
        <text class="t-box" x="510" y="416" text-anchor="middle">SPLIT</text>
        <text class="t-note" x="580" y="410">2-way Wilkinson AFTER the LNA: the 3.2 dB split</text>
        <text class="t-note" x="580" y="424">costs 0.04 dB of noise figure, not 3.2 (§3.3)</text>

        
        <path class="sig-ul" d="M228 428 L228 444"></path>
        <path class="sig-ul" d="M358 428 L358 444"></path>
        <path class="sig-ul" d="M488 428 L488 444"></path>
        <path class="sig-ul" d="M228 444 L488 444"></path>
        <path class="sig-ul" d="M340 444 L340 490" marker-end="url(#p1-ul)"></path>

        
        <path class="sig-dl" d="M272 428 L272 462"></path>
        <path class="sig-dl" d="M402 428 L402 462"></path>
        <path class="sig-dl" d="M532 428 L532 462"></path>
        <path class="sig-dl" d="M272 462 L331 462 A 9 9 0 0 1 349 462 L745 462"></path>
        <path class="sig-dl" d="M745 462 L745 490" marker-end="url(#p1-dl)"></path>

        <text class="t-tiny t-ul" x="222" y="440" text-anchor="end">L legs</text>
        <text class="t-tiny t-dl" x="545" y="458">R legs</text>

        <path class="sig-ul" d="M333 474 L347 466"></path>
        <text class="t-tiny t-ul" x="352" y="476">3</text>
        <path class="sig-dl" d="M738 474 L752 466"></path>
        <text class="t-tiny t-dl" x="757" y="476">3</text>

        
        <rect class="bx-ul" x="140" y="490" width="400" height="180"></rect>
        <text class="t-head t-ul" x="340" y="514" text-anchor="middle">UPLINK COHERENT GROUP</text>
        <text class="t-note" x="340" y="532" text-anchor="middle">chips A + B · tuned ~806–808 MHz</text>
        <text class="t-port" x="188" y="558">A.RX1  ◄ EL 1</text>
        <text class="t-port" x="188" y="576">A.RX2  ◄ EL 2</text>
        <text class="t-port" x="188" y="594">B.RX1  ◄ EL 3</text>
        <text class="t-port t-mut" x="188" y="612">B.RX2  ◄ f_UL reference</text>
        <text class="t-note" x="340" y="638" text-anchor="middle">handset requests and granted voice —</text>
        <text class="t-note t-ul" x="340" y="654" text-anchor="middle">THE BEARINGS THAT MATTER</text>

        
        <rect class="bx-dl" x="570" y="490" width="350" height="180"></rect>
        <text class="t-head t-dl" x="745" y="514" text-anchor="middle">DOWNLINK COHERENT GROUP</text>
        <text class="t-note" x="745" y="532" text-anchor="middle">chips C + D · tuned ~851–853 MHz</text>
        <text class="t-port" x="606" y="558">C.RX1  ◄ EL 1</text>
        <text class="t-port" x="606" y="576">C.RX2  ◄ EL 2</text>
        <text class="t-port" x="606" y="594">D.RX1  ◄ EL 3</text>
        <text class="t-port t-mut" x="606" y="612">D.RX2  ◄ f_DL reference</text>
        <text class="t-note" x="745" y="638" text-anchor="middle">tower signalling + 8TAC95D talkaround,</text>
        <text class="t-note t-dl" x="745" y="654" text-anchor="middle">AND A KNOWN-POSITION REFERENCE (§5.7)</text>

        
        <rect class="bx-q" x="930" y="500" width="80" height="76"></rect>
        <text class="t-box" x="970" y="522" text-anchor="middle">TX ×4</text>
        <text class="t-tiny" x="970" y="540" text-anchor="middle">licence-</text>
        <text class="t-tiny" x="970" y="552" text-anchor="middle">gated in</text>
        <text class="t-tiny" x="970" y="564" text-anchor="middle">software</text>
        <path class="sig" d="M920 538 L930 538"></path>
        <path class="sig" d="M970 500 L970 159 L903 159" marker-end="url(#p1-ink)"></path>

        
        <path class="sig-ul" d="M340 670 L340 692"></path>
        <path class="sig-dl" d="M745 670 L745 692"></path>
        <path class="sig-dig" d="M340 692 L745 692"></path>
        <path class="sig-dig" d="M530 692 L530 760" marker-end="url(#p1-mut)"></path>

        
        <text class="t-note" x="140" y="714">4 × ADRV9002 · 30 MHz–6 GHz · on-chip MCS</text>
        <text class="t-note" x="140" y="728">150 dBc/Hz DR, held across the gain-control range (§3.3)</text>
        <text class="t-tiny" x="140" y="744">FALLBACK: 2 × AD9361, ONE UNIFIED 47 MHz WINDOW (§5.5)</text>

        <rect class="bx" x="200" y="760" width="680" height="60"></rect>
        <text class="t-box" x="540" y="782" text-anchor="middle">FPGA / SoC BRIDGE — Zynq-class (§3.5.1)</text>
        <text class="t-note" x="540" y="800" text-anchor="middle">terminates the LVDS / CMOS SSI IQ interface · hosts the CHANNELISER (§3.3.1) and timing</text>
        <text class="t-note" x="540" y="814" text-anchor="middle">no gigabit serial transceivers required · ADI supply the HDL</text>

        <text class="t-tiny" x="546" y="836">digital IQ — LVDS or CMOS SSI</text>
        <path class="sig-dig" d="M530 820 L530 846" marker-end="url(#p1-mut)"></path>

        <rect class="bx" x="200" y="846" width="680" height="58"></rect>
        <text class="t-box" x="540" y="868" text-anchor="middle">BASEBAND / APPLICATION COMPUTE — Jetson-class</text>
        <text class="t-note" x="540" y="886" text-anchor="middle">P25 CAI demod · TSBK parsing · analog FM demod · control-channel follower</text>
        <text class="t-note" x="540" y="899" text-anchor="middle">decryption, agency-held keys · local AI classifier (fallback path)</text>

        
        <path class="sig-dig" d="M530 904 L530 914"></path>
        <path class="sig-dig" d="M170 914 L890 914"></path>
        <path class="sig-dig" d="M170 914 L170 926" marker-end="url(#p1-mut)"></path>
        <path class="sig-dig" d="M410 914 L410 926" marker-end="url(#p1-mut)"></path>
