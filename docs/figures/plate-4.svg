<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 440" role="img" aria-label="Two receive chains compared. As designed, the amplifier precedes the splitter and system noise figure is 1.04 decibels. Reversed, the splitter precedes the amplifier and noise figure rises to 4.20 decibels." xmlns="http://www.w3.org/2000/svg" width="1040" height="440">
<style>
body {
    background: #F2F4F1; color: #14201C;
    font-family: #000; font-size: 17px; line-height: 1.62;
    margin: 0; padding: 0 24px 96px;
  }
.wrap { max-width: 1120px; margin: 0 auto; }
.prose { max-width: 65ch; }
header.masthead {
    padding: 72px 0 40px; border-bottom: 1px solid #C3CCC5; margin-bottom: 48px;
  }
.eyebrow {
    font-family: #000; font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: #6B7A73; margin: 0 0 18px;
  }
h1 {
    font-family: #000; font-size: clamp(30px, 4.4vw, 46px); font-weight: 640;
    letter-spacing: -.02em; line-height: 1.08; text-wrap: balance; margin: 0 0 20px;
  }
.standfirst { font-size: 19px; color: #6B7A73; margin: 0; max-width: 62ch; }
h2 {
    font-family: #000; font-size: 22px; font-weight: 620;
    letter-spacing: -.01em; text-wrap: balance; margin: 0 0 6px;
  }
p { margin: 0 0 18px; }
section { margin-bottom: 64px; }
.section-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.section-head p { margin: 0; color: #6B7A73; font-size: 16px; max-width: 62ch; }
strong { font-weight: 600; }
code { font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: .88em; }
.plate {
    background: #FBFCFA;
    background-image:
      linear-gradient(#000 1px, transparent 1px),
      linear-gradient(90deg, #000 1px, transparent 1px);
    background-size: 20px 20px;
    border: 1px solid #C3CCC5; padding: 18px; overflow-x: auto;
  }
.plate svg { display: block; width: 100%; min-width: 720px; height: auto; }
.frame { fill: none; stroke: #C3CCC5; stroke-width: 1.3; }
.bx { fill: #FBFCFA; stroke: #14201C; stroke-width: 1.3; }
.bx-ul { fill: none; stroke: #B4571A; stroke-width: 1.6; }
.bx-dl { fill: none; stroke: #16746B; stroke-width: 1.6; }
.bx-q { fill: #FBFCFA; stroke: #6B7A73; stroke-width: 1.2; }
.sig { fill: none; stroke: #14201C; stroke-width: 1.4; }
.sig-ul { fill: none; stroke: #B4571A; stroke-width: 2.2; }
.sig-dl { fill: none; stroke: #16746B; stroke-width: 2.2; }
.sig-cal { fill: none; stroke: #6B7A73; stroke-width: 1.2; stroke-dasharray: 5 3.5; }
.sig-dig { fill: none; stroke: #6B7A73; stroke-width: 1.6; }
.dock { fill: none; stroke: #14201C; stroke-width: 2; stroke-dasharray: 12 5; opacity: .55; }
.pill { fill: #FBFCFA; stroke: none; }
.a-ink { fill: #14201C; }
.a-ul { fill: #B4571A; }
.a-dl { fill: #16746B; }
.a-mut { fill: #6B7A73; }
text { font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; fill: #14201C; }
.t-box { font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.t-head { font-size: 12px;   font-weight: 700; letter-spacing: .09em; }
.t-note { font-size: 10px;   fill: #6B7A73; }
.t-port { font-size: 11px; }
.t-tiny { font-size: 9px;    fill: #6B7A73; letter-spacing: .06em; }
.t-ul { fill: #B4571A; }
.t-dl { fill: #16746B; }
.t-mut { fill: #6B7A73; }
.notes { display: grid; gap: 0; margin-top: 32px; border-top: 1px solid #C3CCC5; }
.note {
    display: grid; grid-template-columns: 116px 1fr; gap: 24px;
    padding: 18px 0; border-bottom: 1px solid #C3CCC5; align-items: start;
  }
.note dt {
    font-family: Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; font-size: 12px; font-weight: 600;
    letter-spacing: .04em; color: #6B7A73; padding-top: 3px;
  }
.note dd { margin: 0; font-size: 16px; }
.verdict { border-left: 3px solid #B4571A; padding: 2px 0 2px 22px; margin: 0 0 18px; }
</style>
<rect x="0" y="0" width="1040" height="440" fill="#FBFCFA"/>

        <defs>
          <marker id="p4-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-ink"></path>
          </marker>
          <marker id="p4-ul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-ul"></path>
          </marker>
          <marker id="p4-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" class="a-dl"></path>
          </marker>
        </defs>

        
        <rect class="frame" x="20" y="40" width="480" height="250"></rect>
        <text class="t-head" x="34" y="66">AS DESIGNED — SPLIT AFTER THE LNA</text>

        <path class="sig" d="M60 150 L60 122 M50 122 L60 108 L70 122"></path>
        <text class="t-tiny" x="60" y="166" text-anchor="middle">EL</text>

        <path class="sig" d="M60 150 L110 150" marker-end="url(#p4-ink)"></path>
        <rect class="bx" x="110" y="126" width="110" height="48"></rect>
        <text class="t-box" x="165" y="146" text-anchor="middle">LNA</text>
        <text class="t-note" x="165" y="162" text-anchor="middle">NF 1.0 · G 20 dB</text>

        <path class="sig" d="M220 150 L270 150" marker-end="url(#p4-ink)"></path>
        <rect class="bx" x="270" y="126" width="110" height="48"></rect>
        <text class="t-box" x="325" y="146" text-anchor="middle">SPLIT</text>
        <text class="t-note" x="325" y="162" text-anchor="middle">−3.2 dB</text>

        <path class="sig-ul" d="M380 138 L460 122" marker-end="url(#p4-ul)"></path>
        <path class="sig-dl" d="M380 162 L460 178" marker-end="url(#p4-dl)"></path>
        <text class="t-tiny t-ul" x="466" y="120">uplink group</text>
        <text class="t-tiny t-dl" x="466" y="182">downlink group</text>

        <text class="t-note" x="34" y="216">F = 1.259 + (2.089 − 1) ÷ 100  =  1.270</text>
        <text class="t-box"  x="34" y="242">SYSTEM NOISE FIGURE  1.04 dB</text>
        <text class="t-note t-ul" x="34" y="262">penalty for the split: +0.04 dB</text>
        <text class="t-note" x="34" y="278">the 20 dB of gain ahead of the loss divides it away</text>

        
        <rect class="frame" x="540" y="40" width="480" height="250"></rect>
        <text class="t-head t-ul" x="554" y="66">REVERSED — SPLIT BEFORE THE LNA</text>

        <path class="sig" d="M580 150 L580 122 M570 122 L580 108 L590 122"></path>
        <text class="t-tiny" x="580" y="166" text-anchor="middle">EL</text>

        <path class="sig" d="M580 150 L630 150" marker-end="url(#p4-ink)"></path>
        <rect class="bx" x="630" y="126" width="110" height="48"></rect>
        <text class="t-box" x="685" y="146" text-anchor="middle">SPLIT</text>
        <text class="t-note" x="685" y="162" text-anchor="middle">−3.2 dB</text>

        <path class="sig" d="M740 150 L790 150" marker-end="url(#p4-ink)"></path>
        <rect class="bx" x="790" y="126" width="110" height="48"></rect>
        <text class="t-box" x="845" y="146" text-anchor="middle">LNA</text>
        <text class="t-note" x="845" y="162" text-anchor="middle">NF 1.0 · G 20 dB</text>

        <path class="sig" d="M900 150 L960 150" marker-end="url(#p4-ink)"></path>

        <text class="t-note" x="554" y="216">F = 2.089 + (1.259 − 1) ÷ 0.479  =  2.630</text>
        <text class="t-box t-ul" x="554" y="242">SYSTEM NOISE FIGURE  4.20 dB</text>
        <text class="t-note t-ul" x="554" y="262">penalty for the split: +3.20 dB</text>
        <text class="t-note" x="554" y="278">the loss now sits where nothing has amplified the signal yet</text>

        
        <path class="frame" d="M20 316 L1020 316"></path>
        <text class="t-head" x="20" y="344">FRIIS, THE ONLY THING THIS DRAWING IS ABOUT</text>
        <text class="t-box" x="20" y="372">F_total  =  F₁  +  (F₂ − 1) ÷ G₁</text>
        <text class="t-note" x="20" y="392">The second stage's noise contribution is divided by everything that amplified before it. The splitter's loss is real in both</text>
        <text class="t-note" x="20" y="406">arrangements — what changes is whether 100× of gain stands in front of it. Placement, not component quality, buys the 3.16 dB.</text>

        <text class="t-tiny" x="1020" y="392" text-anchor="end">PLATE 4 · SOURCE §3.3</text>
        <text class="t-tiny" x="1020" y="406" text-anchor="end">REVISED 2026-07-31</text>
      </svg>