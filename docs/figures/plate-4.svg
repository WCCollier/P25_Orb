<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 440" role="img" aria-label="Two receive chains compared. As designed, the amplifier precedes the splitter and system noise figure is 1.04 decibels. Reversed, the splitter precedes the amplifier and noise figure rises to 4.20 decibels." xmlns="http://www.w3.org/2000/svg" width="1040" height="440">
<rect x="0" y="0" width="1040" height="440" fill="#FBFCFA"/>

        <defs>
          <marker id="p4-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#14201C"></path>
          </marker>
          <marker id="p4-ul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#B4571A"></path>
          </marker>
          <marker id="p4-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#16746B"></path>
          </marker>
        </defs>

        
        <rect x="20" y="40" width="480" height="250" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
        <text x="34" y="66" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">AS DESIGNED — SPLIT AFTER THE LNA</text>

        <path d="M60 150 L60 122 M50 122 L60 108 L70 122" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <text x="60" y="166" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">EL</text>

        <path d="M60 150 L110 150" marker-end="url(#p4-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <rect x="110" y="126" width="110" height="48" fill="#FBFCFA" stroke="#14201C" stroke-width="1.3"></rect>
        <text x="165" y="146" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">LNA</text>
        <text x="165" y="162" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">NF 1.0 · G 20 dB</text>

        <path d="M220 150 L270 150" marker-end="url(#p4-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <rect x="270" y="126" width="110" height="48" fill="#FBFCFA" stroke="#14201C" stroke-width="1.3"></rect>
        <text x="325" y="146" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">SPLIT</text>
        <text x="325" y="162" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">−3.2 dB</text>

        <path d="M380 138 L460 122" marker-end="url(#p4-ul)" fill="none" stroke="#B4571A" stroke-width="2.2"></path>
        <path d="M380 162 L460 178" marker-end="url(#p4-dl)" fill="none" stroke="#16746B" stroke-width="2.2"></path>
        <text x="466" y="120" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="9px" letter-spacing=".06em">uplink group</text>
        <text x="466" y="182" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="9px" letter-spacing=".06em">downlink group</text>

        <text x="34" y="216" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">F = 1.259 + (2.089 − 1) ÷ 100  =  1.270</text>
        <text  x="34" y="242" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">SYSTEM NOISE FIGURE  1.04 dB</text>
        <text x="34" y="262" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">penalty for the split: +0.04 dB</text>
        <text x="34" y="278" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">the 20 dB of gain ahead of the loss divides it away</text>

        
        <rect x="540" y="40" width="480" height="250" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
        <text x="554" y="66" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="12px" font-weight="700" letter-spacing=".09em">REVERSED — SPLIT BEFORE THE LNA</text>

        <path d="M580 150 L580 122 M570 122 L580 108 L590 122" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <text x="580" y="166" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">EL</text>

        <path d="M580 150 L630 150" marker-end="url(#p4-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <rect x="630" y="126" width="110" height="48" fill="#FBFCFA" stroke="#14201C" stroke-width="1.3"></rect>
        <text x="685" y="146" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">SPLIT</text>
        <text x="685" y="162" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">−3.2 dB</text>

        <path d="M740 150 L790 150" marker-end="url(#p4-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>
        <rect x="790" y="126" width="110" height="48" fill="#FBFCFA" stroke="#14201C" stroke-width="1.3"></rect>
        <text x="845" y="146" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">LNA</text>
        <text x="845" y="162" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">NF 1.0 · G 20 dB</text>

        <path d="M900 150 L960 150" marker-end="url(#p4-ink)" fill="none" stroke="#14201C" stroke-width="1.4"></path>

        <text x="554" y="216" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">F = 2.089 + (1.259 − 1) ÷ 0.479  =  2.630</text>
        <text x="554" y="242" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">SYSTEM NOISE FIGURE  4.20 dB</text>
        <text x="554" y="262" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">penalty for the split: +3.20 dB</text>
        <text x="554" y="278" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">the loss now sits where nothing has amplified the signal yet</text>

        
        <path d="M20 316 L1020 316" fill="none" stroke="#C3CCC5" stroke-width="1.3"></path>
        <text x="20" y="344" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">FRIIS, THE ONLY THING THIS DRAWING IS ABOUT</text>
        <text x="20" y="372" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">F_total  =  F₁  +  (F₂ − 1) ÷ G₁</text>
        <text x="20" y="392" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">The second stage's noise contribution is divided by everything that amplified before it. The splitter's loss is real in both</text>
        <text x="20" y="406" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">arrangements — what changes is whether 100× of gain stands in front of it. Placement, not component quality, buys the 3.16 dB.</text>

        <text x="1020" y="392" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">PLATE 4 · SOURCE §3.3</text>
        <text x="1020" y="406" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">REVISED 2026-07-31</text>
      </svg>