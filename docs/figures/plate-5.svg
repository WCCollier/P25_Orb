<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 620" role="img" aria-label="Three panels. Good crossing geometry produces a compact fix. Shallow crossing geometry produces a long thin error ellipse. Three stations produce a residual triangle that proves someone is wrong without identifying which one." xmlns="http://www.w3.org/2000/svg" width="1040" height="620">
<rect x="0" y="0" width="1040" height="620" fill="#FBFCFA"/>

        <defs>
          <marker id="p5-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#14201C"></path>
          </marker>
          <marker id="p5-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#6B7A73"></path>
          </marker>
        </defs>

        
        <rect x="20" y="40" width="330" height="400" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
        <text x="34" y="64" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="12px" font-weight="700" letter-spacing=".09em">A — GOOD GEOMETRY</text>
        <text x="34" y="80" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">wide crossing angle · compact fix</text>

        <polygon points="70,365 228,130 158,96" fill="#DDEAE7" stroke="none"></polygon>
        <polygon points="300,370 215,100 144,134" fill="#DDEAE7" stroke="none"></polygon>
        <path d="M70 365 L193 113" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M300 370 L179 117" fill="none" stroke="#14201C" stroke-width="1"></path>

        <ellipse cx="185" cy="130" rx="27" ry="20" transform="rotate(-20 185 130)" fill="#D1D4D2" stroke="#D1D4D2" stroke-width="1.2"></ellipse>
        <circle cx="185" cy="130" r="3" fill="#14201C"></circle>
        <text x="218" y="126" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">THE FIX</text>

        <circle cx="70" cy="365" r="6" fill="#14201C"></circle>
        <circle cx="300" cy="370" r="6" fill="#14201C"></circle>
        <text x="70" y="387" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 1</text>
        <text x="300" y="392" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 2</text>

        <path d="M145 211 A 90 90 0 0 1 224 211" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="185" y="230" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">≈ 74°</text>

        <text x="34" y="422" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">Uncertainty in both bearings resolves to a small</text>
        <text x="34" y="434" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="10px">area. GDOP is low. The solver reports the fix.</text>

        
        <rect x="370" y="40" width="330" height="400" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
        <text x="384" y="64" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="12px" font-weight="700" letter-spacing=".09em">B — SHALLOW CROSSING</text>
        <text x="384" y="80" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">same bearing quality · far worse position</text>

        <polygon points="400,375 653,151 581,90" fill="#F2E7DD" stroke="none"></polygon>
        <polygon points="500,380 650,128 574,96" fill="#F2E7DD" stroke="none"></polygon>
        <path d="M400 375 L617 120" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M500 380 L612 112" fill="none" stroke="#14201C" stroke-width="1"></path>

        <ellipse cx="600" cy="140" rx="62" ry="15" transform="rotate(-59 600 140)" fill="#D1D4D2" stroke="#D1D4D2" stroke-width="1.2"></ellipse>
        <circle cx="600" cy="140" r="3" fill="#14201C"></circle>

        <circle cx="400" cy="375" r="6" fill="#14201C"></circle>
        <circle cx="500" cy="380" r="6" fill="#14201C"></circle>
        <text x="400" y="397" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 1</text>
        <text x="500" y="402" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 2</text>

        <path d="M529 224 A 110 110 0 0 1 558 242" fill="none" stroke="#6B7A73" stroke-width="1"></path>
        <text x="512" y="262" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">≈ 22°</text>

        <text x="384" y="422" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">The error runs along the line of sight, not across</text>
        <text x="384" y="434" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">it. GDOP is high, and the solver says so.</text>

        
        <rect x="720" y="40" width="300" height="400" fill="none" stroke="#C3CCC5" stroke-width="1.3"></rect>
        <text x="734" y="64" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">C — THREE STATIONS</text>
        <text x="734" y="80" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">a residual appears, and it is not enough</text>

        <path d="M770 385 L890 112" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M900 392 L845 134" fill="none" stroke="#14201C" stroke-width="1"></path>
        <path d="M985 300 L820 168" fill="none" stroke="#14201C" stroke-width="1"></path>

        <circle cx="770" cy="385" r="6" fill="#14201C"></circle>
        <circle cx="900" cy="392" r="6" fill="#14201C"></circle>
        <circle cx="985" cy="300" r="6" fill="#14201C"></circle>
        <text x="758" y="389" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 1</text>
        <text x="912" y="396" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 2</text>
        <text x="972" y="290" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11px">ORB 3</text>

        <circle cx="861" cy="182" r="26" fill="none" stroke="#B4571A" stroke-width="1.8"></circle>
        <path d="M835 182 L762 152" fill="none" stroke="#6B7A73" stroke-width=".9" stroke-dasharray="4 3"></path>
        <text x="734" y="140" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">RESIDUAL</text>
        <text x="734" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">TRIANGLE</text>

        <text x="734" y="410" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">A large triangle proves someone is wrong.</text>
        <text x="734" y="422" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">Remove any one ray and the other two meet</text>
        <text x="734" y="434" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="10px">exactly — so it cannot say which.</text>

        
        <path d="M20 466 L1020 466" fill="none" stroke="#C3CCC5" stroke-width="1.3"></path>
        <text x="20" y="492" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="12px" font-weight="700" letter-spacing=".09em">WHAT df/aoa_fix.py REPORTS, AND WHAT IT REFUSES TO</text>

        <rect x="20" y="506" width="320" height="76" fill="none" stroke="#16746B" stroke-width="1.6"></rect>
        <text x="36" y="528" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#16746B" font-size="11.5px" font-weight="600" letter-spacing=".02em">REPORTED</text>
        <text x="36" y="544" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">position · rms residual · GDOP</text>
        <text x="36" y="558" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">forward consistency · a trust flag</text>
        <text x="36" y="572" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">that requires GDOP below 10</text>

        <rect x="360" y="506" width="320" height="76" fill="none" stroke="#B4571A" stroke-width="1.6"></rect>
        <text x="376" y="528" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#B4571A" font-size="11.5px" font-weight="600" letter-spacing=".02em">WITHHELD ON TWO STATIONS</text>
        <text x="376" y="544" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">no residual claim is made at all,</text>
        <text x="376" y="558" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">because two rays always meet —</text>
        <text x="376" y="572" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">agreement there would be an artefact</text>

        <rect x="700" y="506" width="320" height="76" fill="#FBFCFA" stroke="#14201C" stroke-width="1.3"></rect>
        <text x="716" y="528" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#14201C" font-size="11.5px" font-weight="600" letter-spacing=".02em">STILL NOT ANSWERABLE</text>
        <text x="716" y="544" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">which bearing is the bad one. That</text>
        <text x="716" y="558" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">needs a fourth station, an independent</text>
        <text x="716" y="572" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="10px">quality metric, or outside knowledge</text>

        <text x="1020" y="604" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#6B7A73" font-size="9px" letter-spacing=".06em">PLATE 5 · SOURCE §5.9, df/aoa_fix.py · REVISED 2026-08-01</text>
      </svg>