<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P25 Orb — Presenter View</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /*
   * Built for one job: a remote screen share, where the audience sees a
   * compressed video stream of a 16:9 display and cannot alt-tab with us.
   * The RF Environment drives the timeline and the Command Feed reacts to it,
   * so showing them one at a time loses the only thing worth demonstrating —
   * that the reaction is immediate. Same origin, so the BroadcastChannel the
   * two pages already use to talk to each other works unchanged through the
   * frames; this file adds no logic of its own.
   */

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  .stage {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--rule, #2a3630);
    font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .bar .spacer { flex: 1; }

  .bar a {
    color: inherit;
    opacity: .6;
    text-decoration: none;
    letter-spacing: .1em;
  }

  .bar a:hover, .bar a:focus-visible { opacity: 1; }

  .panes {
    display: grid;
    /* The RF Environment is evidence, not the argument: it needs to be visibly
       present and readable, but the Command Feed is what the audience should be
       reading. Two thirds to the side that carries the pitch. */
    grid-template-columns: 1fr 2fr;
    gap: 0;
    min-height: 0;
    transition: grid-template-columns .2s ease;
  }

  .panes.rf-collapsed { grid-template-columns: 34px 1fr; }

  .pane {
    display: grid;
    grid-template-rows: auto 1fr;
    min-width: 0;
    min-height: 0;
  }

  .pane + .pane { border-left: 1px solid var(--rule, #2a3630); }

  .pane h2 {
    margin: 0;
    padding: 5px 12px;
    font: 600 10px/1.6 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .16em;
    text-transform: uppercase;
    opacity: .55;
  }

  .pane iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /*
   * min-width: 0 on the header below lets the h2 shrink, but shrinking isn't
   * clipping — collapsed to 34px, its text is still too wide to fit and was
   * painting straight past this pane's own edge into the Command Feed pane
   * next door, where the rail (scoped to this pane's box) can't reach it.
   *
   * The distinct background, accent edge and shadow are deliberate: the
   * Command Feed is the argument, the RF Environment is a drawer of evidence
   * beside it. Reading as a panel rather than an equal column is the visual
   * cue that it slides away, before anyone's touched the collapse button.
   */
  .pane-rf {
    position: relative;
    overflow: hidden;
    background: var(--bg-sunken);
    border-right: 2px solid var(--accent);
    box-shadow: 6px 0 18px -8px rgba(0, 0, 0, 0.6);
  }

  .pane-head {
    display: flex;
    align-items: center;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--line-strong);
  }
  .pane-head h2 { flex: 1; min-width: 0; }

  .collapse-btn {
    flex: 0 0 auto;
    margin-right: 8px;
    font: 600 11px ui-monospace, monospace;
    padding: 2px 6px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 3px;
    opacity: .6;
  }

  .collapse-btn:hover, .collapse-btn:focus-visible { opacity: 1; }

  /*
   * Collapsing does not shrink the iframe itself down to the 34px rail — an
   * earlier version did, and squeezing rf-environment.html's own layout into
   * a sliver produced visible rendering bleed rather than a clean crop.
   * Instead the iframe is pulled out of grid flow and moved off-canvas at a
   * comfortable, ordinary width, so its own CSS never has to cope with a
   * pathological viewport. It still keeps a real, painted box the whole
   * time — position, not display — which is what actually matters for
   * requestAnimationFrame: Chrome's out-of-viewport throttling is documented
   * as applying only to cross-origin iframes, and this one is same-origin.
   */
  .panes.rf-collapsed .pane-rf iframe {
    position: absolute;
    top: 0;
    left: -2000px;
    width: 1100px;
  }

  .rf-rail {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--bg-raised);
    border: 0;
    cursor: pointer;
    color: inherit;
    padding: 0;
  }

  .panes.rf-collapsed .rf-rail { display: flex; }

  .rf-rail span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font: 600 10px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    opacity: .7;
  }

  .rf-rail:hover span, .rf-rail:focus-visible span { opacity: 1; }

  /*
   * Screen-share codecs punish fine detail far harder than a local display
   * does. Zooming the framed pages trades visible area for stroke weight,
   * which is the right trade when the audience is watching 1080p video of a
   * 1080p screen. Adjust with the buttons; 110% is a sane starting point.
   */
  .zoom { display: flex; gap: 6px; align-items: center; opacity: .75; }

  .zoom button {
    font: 600 11px ui-monospace, monospace;
    padding: 3px 9px;
    cursor: pointer;
    color: inherit;
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 3px;
    opacity: .7;
  }

  .zoom button:hover, .zoom button:focus-visible { opacity: 1; }

  /* Stacked panes below a laptop-ish width, so this stays usable if the
     presenting machine is not the one it was laid out for. */
  @media (max-width: 1100px) {
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--rule, #2a3630); }
    /* Stacked layout collapses to a thin horizontal strip instead of a
       vertical one, so the rail's label has to lie back down flat too. */
    .panes.rf-collapsed { grid-template-columns: 1fr; grid-template-rows: 34px 1fr; }
    .rf-rail span { writing-mode: horizontal-tb; transform: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="bar">
    <span>P25 Orb — Presenter View</span>
    <span class="spacer"></span>
    <span class="zoom">
      <button type="button" id="zoom-out" aria-label="Decrease panel zoom">−</button>
      <span id="zoom-level">110%</span>
      <button type="button" id="zoom-in" aria-label="Increase panel zoom">+</button>
    </span>
    <a href="index.html">All pages</a>
  </div>

  <div class="panes" id="panes">
    <section class="pane pane-rf">
      <div class="pane-head">
        <h2>RF Environment — the radio traffic</h2>
        <button type="button" class="collapse-btn" id="rf-collapse"
                aria-label="Collapse RF Environment" title="Collapse RF Environment">&#9668;</button>
      </div>
      <iframe id="left" src="rf-environment.html" title="RF Environment"></iframe>
      <button type="button" class="rf-rail" id="rf-expand" hidden
              aria-label="Expand RF Environment" title="Expand RF Environment">
        <span>RF Environment</span>
      </button>
    </section>
    <section class="pane">
      <h2>Command Feed — what the operator sees</h2>
      <iframe id="right" src="command-feed.html" title="Command Feed"></iframe>
    </section>
  </div>
</div>

<script>
  // Zoom is applied inside each frame rather than to this page, so the column
  // split holds and only the content scales.
  const frames = [document.getElementById('left'), document.getElementById('right')];
  const label = document.getElementById('zoom-level');
  let zoom = 110;

  function apply() {
    label.textContent = zoom + '%';
    for (const frame of frames) {
      const doc = frame.contentDocument;
      if (doc) doc.documentElement.style.zoom = zoom + '%';
    }
  }

  for (const frame of frames) frame.addEventListener('load', apply);
  document.getElementById('zoom-in').addEventListener('click', () => {
    zoom = Math.min(200, zoom + 10);
    apply();
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    zoom = Math.max(70, zoom - 10);
    apply();
  });

  // Collapsing never touches the RF Environment iframe itself — see the
  // .rf-rail comment in the stylesheet for why. This just narrows its column
  // and shows the rail on top of it.
  const panes = document.getElementById('panes');
  const rfCollapse = document.getElementById('rf-collapse');
  const rfExpand = document.getElementById('rf-expand');

  function setRfCollapsed(collapsed) {
    panes.classList.toggle('rf-collapsed', collapsed);
    rfCollapse.hidden = collapsed;
    rfExpand.hidden = !collapsed;
  }

  rfCollapse.addEventListener('click', () => setRfCollapsed(true));
  rfExpand.addEventListener('click', () => setRfCollapsed(false));
</script>

</body>
</html>
